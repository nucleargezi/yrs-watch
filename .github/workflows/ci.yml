name: CI

on:
  push:
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Each step writes its output to a file (a pipe could be held open by a
    # leftover process), prints it, and on failure repeats the tail as an error
    # annotation, which stays readable without signing in.
    env:
      STEP: |
        step() {
          local name=$1 status=0; shift
          # GitHub runs steps with bash -e; keep going so the log is reported.
          timeout 600 "$@" > step.log 2>&1 || status=$?
          cat step.log
          if [ $status -ne 0 ]; then
            echo "::error title=$name (exit $status)::$(tail -c 3500 step.log | tr '\n' '|')"
          fi
          return $status
        }
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          eval "$STEP"
          step apt-update sudo apt-get update
          step apt-install sudo apt-get install -y --no-install-recommends g++ make pkg-config \
            libglib2.0-dev libglib2.0-bin libjson-glib-dev libpango1.0-dev \
            python3-gi dbus fonts-dejavu-core fonts-wqy-microhei
      - name: Build
        run: eval "$STEP"; step build make -j
      - name: Test
        run: eval "$STEP"; step test make test
      - name: Test with sanitizers
        run: eval "$STEP"; step asan make -j test-asan
      - name: Test with NDEBUG
        run: |
          eval "$STEP"
          make clean
          step ndebug make test CXXFLAGS="-O2 -DNDEBUG"
